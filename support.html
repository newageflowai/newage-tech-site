<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Support Portal</title>

  <style>
    body { font-family: Arial, sans-serif; margin: 24px; }
    .row { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
    .card { border:1px solid #ddd; border-radius:10px; padding:16px; margin:16px 0; }
    .muted { color:#666; }
    .hidden { display:none !important; }
    button { padding:10px 14px; border-radius:8px; border:1px solid #ccc; cursor:pointer; }
    input { padding:10px 12px; border-radius:8px; border:1px solid #ccc; min-width:260px; }
    .danger { border-color:#e99; }
    pre { background:#f7f7f7; padding:12px; border-radius:10px; overflow:auto; }
    .ok { color: #0a7; }
    .bad { color: #c22; }
  </style>

  <!-- Supabase JS (UMD build) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
  <h1>Support Portal</h1>
  <p class="muted">Login to see your organization tools. Admins will see maintenance controls.</p>

  <!-- LOGIN CARD -->
  <div id="loginCard" class="card">
    <h2>Login</h2>
    <div class="row">
      <input id="email" type="email" placeholder="Email" autocomplete="email" />
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" />
      <button id="loginBtn">Sign in</button>
      <button id="logoutBtn" class="hidden">Sign out</button>
    </div>
    <p id="authMsg" class="muted"></p>
  </div>

  <!-- USER INFO -->
  <div id="userCard" class="card hidden">
    <h2>Account</h2>
    <p><strong>User:</strong> <span id="userEmail"></span></p>
    <p><strong>Role:</strong> <span id="userRole"></span></p>
    <p><strong>Organization:</strong> <span id="orgName"></span></p>

    <div class="row">
      <a id="anydeskLink" class="hidden" href="https://anydesk.com/en/downloads" target="_blank" rel="noreferrer">
        <button type="button">Download AnyDesk</button>
      </a>
    </div>
  </div>

  <!-- ADMIN AREA -->
  <div id="adminCard" class="card hidden">
    <h2>Admin</h2>
    <p class="muted">Maintenance tasks (admin only).</p>

    <!-- IMPORTANT: type="button" prevents form-submit behavior -->
    <div class="row">
      <button id="adminMaintenanceBtn" type="button" class="danger">Run Maintenance</button>
      <button id="adminTestBtn" type="button">Test Click</button>
    </div>

    <p id="adminMsg" class="muted"></p>
    <pre id="adminLog"></pre>
  </div>

  <script>
    /***************************************************************
     * 1) CONFIG — PUT YOUR VALUES HERE
     ***************************************************************/
    const SUPABASE_URL = "https://YOUR_PROJECT.supabase.co";
    const SUPABASE_ANON_KEY = "YOUR_ANON_PUBLIC_KEY";

    // If you use an Edge Function for maintenance, set the name here.
    // In Supabase dashboard: Edge Functions -> your function name.
    const MAINTENANCE_FUNCTION_NAME = "admin-maintenance"; // change if needed

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    /***************************************************************
     * 2) DOM ELEMENTS
     ***************************************************************/
    const loginCard = document.getElementById("loginCard");
    const userCard  = document.getElementById("userCard");
    const adminCard = document.getElementById("adminCard");

    const emailEl = document.getElementById("email");
    const passEl  = document.getElementById("password");

    const loginBtn  = document.getElementById("loginBtn");
    const logoutBtn = document.getElementById("logoutBtn");

    const authMsg = document.getElementById("authMsg");

    const userEmailEl = document.getElementById("userEmail");
    const userRoleEl  = document.getElementById("userRole");
    const orgNameEl   = document.getElementById("orgName");

    const anydeskLink = document.getElementById("anydeskLink");

    const adminMaintenanceBtn = document.getElementById("adminMaintenanceBtn");
    const adminTestBtn        = document.getElementById("adminTestBtn");
    const adminMsg            = document.getElementById("adminMsg");
    const adminLog            = document.getElementById("adminLog");

    /***************************************************************
     * 3) HELPERS
     ***************************************************************/
    function setAuthMessage(msg, isError = false) {
      authMsg.textContent = msg || "";
      authMsg.className = isError ? "bad" : "muted";
    }

    function logAdmin(line) {
      const ts = new Date().toLocaleString();
      adminLog.textContent = `[${ts}] ${line}\n` + adminLog.textContent;
    }

    function show(el) { el.classList.remove("hidden"); }
    function hide(el) { el.classList.add("hidden"); }

    /***************************************************************
     * 4) LOAD PROFILE + ORG NAME (fixes “org shows id not name”)
     *
     * Expected tables:
     * - profiles: id (uuid = auth.users.id), role (text), org_id (uuid)
     * - orgs: id (uuid), name (text)
     ***************************************************************/
    async function loadProfileAndOrg(userId) {
      // Read profile
      const { data: profile, error: pErr } = await supabase
        .from("profiles")
        .select("id, role, org_id")
        .eq("id", userId)
        .single();

      if (pErr) throw pErr;

      let orgName = "(none)";
      if (profile?.org_id) {
        const { data: org, error: oErr } = await supabase
          .from("orgs")
          .select("name")
          .eq("id", profile.org_id)
          .single();

        if (oErr) {
          // Don’t hard fail for org name issues; just show org_id fallback.
          orgName = String(profile.org_id);
        } else {
          orgName = org?.name ?? String(profile.org_id);
        }
      }

      return { role: profile?.role ?? "user", orgName };
    }

    /***************************************************************
     * 5) UI REFRESH BASED ON SESSION
     ***************************************************************/
    async function refreshUI() {
      setAuthMessage("");

      const { data: { session } } = await supabase.auth.getSession();

      if (!session) {
        // logged out state
        hide(userCard);
        hide(adminCard);
        hide(logoutBtn);
        show(loginBtn);

        anydeskLink.classList.add("hidden");
        userEmailEl.textContent = "";
        userRoleEl.textContent = "";
        orgNameEl.textContent = "";
        return;
      }

      // logged in state
      show(userCard);
      show(logoutBtn);
      hide(loginBtn);

      userEmailEl.textContent = session.user.email ?? "(unknown)";

      // Show AnyDesk only after login
      anydeskLink.classList.remove("hidden");

      try {
        const { role, orgName } = await loadProfileAndOrg(session.user.id);
        userRoleEl.textContent = role;
        orgNameEl.textContent = orgName;

        // Admin gating
        if (String(role).toLowerCase() === "admin") {
          show(adminCard);
          adminMsg.textContent = "Admin tools enabled.";
        } else {
          hide(adminCard);
        }
      } catch (err) {
        console.error(err);
        userRoleEl.textContent = "(error)";
        orgNameEl.textContent = "(error)";
        hide(adminCard);
        setAuthMessage("Profile load failed. Check console & RLS policies.", true);
      }
    }

    /***************************************************************
     * 6) AUTH BUTTONS
     ***************************************************************/
    loginBtn.addEventListener("click", async () => {
      const email = emailEl.value.trim();
      const password = passEl.value;

      setAuthMessage("Signing in...");
      const { data, error } = await supabase.auth.signInWithPassword({ email, password });

      if (error) {
        setAuthMessage(error.message, true);
        return;
      }

      setAuthMessage("Signed in.", false);
      await refreshUI();
    });

    logoutBtn.addEventListener("click", async () => {
      setAuthMessage("Signing out...");
      const { error } = await supabase.auth.signOut();
      if (error) setAuthMessage(error.message, true);
      else setAuthMessage("Signed out.", false);

      await refreshUI();
    });

    /***************************************************************
     * 7) ADMIN BUTTON FIX (the main thing you asked for)
     *
     * Key changes that prevent “does nothing”:
     * - Listeners are attached AFTER DOM exists (script is at end of body)
     * - Button has type="button" so it won’t submit any form
     * - We log + alert on click to prove it fires
     * - try/catch shows errors instead of failing silently
     ***************************************************************/
    adminTestBtn.addEventListener("click", (e) => {
      e.preventDefault();
      alert("Admin test click ✅");
      logAdmin("Admin test click ✅ (listener is attached)");
    });

    adminMaintenanceBtn.addEventListener("click", async (e) => {
      e.preventDefault();

      alert("Maintenance clicked ✅"); // remove later if you want
      logAdmin("Maintenance button clicked.");

      adminMsg.textContent = "Running maintenance...";
      adminMsg.className = "muted";

      try {
        // Option A: Edge Function (recommended)
        // You must have an Edge Function deployed named MAINTENANCE_FUNCTION_NAME.
        const { data, error } = await supabase.functions.invoke(MAINTENANCE_FUNCTION_NAME, {
          body: { action: "run" }
        });

        if (error) throw error;

        logAdmin("Maintenance success. Response: " + JSON.stringify(data));
        adminMsg.textContent = "Maintenance complete ✅";
        adminMsg.className = "ok";

      } catch (err) {
        console.error(err);
        logAdmin("Maintenance failed: " + (err?.message ?? String(err)));
        adminMsg.textContent = "Maintenance failed ❌ (see console/admin log)";
        adminMsg.className = "bad";
        alert("Maintenance failed: " + (err?.message ?? String(err)));
      }
    });

    /***************************************************************
     * 8) SESSION LISTENER
     ***************************************************************/
    supabase.auth.onAuthStateChange(async () => {
      await refreshUI();
    });

    // Initial load
    refreshUI();
  </script>
</body>
</html>
